name: sensortrack
description: "SensorTrack - Aplicación de monitoreo de sensores con Supabase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # Sensores físicos
  sensors_plus: ^7.1.1

  # GPS / Ubicación
  geolocator: ^11.0.0

  # Gráficos
  fl_chart: ^0.68.0

  # Formato de fechas
  intl: ^0.19.0

  # Íconos extra
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
